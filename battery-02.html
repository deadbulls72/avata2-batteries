<!doctype html><html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>DJI Avata 2 — АКБ №02</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#111;color:#f5f5f5;margin:0;padding:24px}
.card{max-width:520px;margin:0 auto;background:#1d1d1f;border-radius:20px;padding:24px;box-shadow:0 8px 30px #0008}
h1{font-size:25px;margin:0 0 8px}.sub{color:#aaa;margin-bottom:24px}
.row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #333}
.label{color:#aaa}.value{font-weight:600;text-align:right;word-break:break-all}
.cycles{font-size:42px;font-weight:800;text-align:center;margin:24px 0 6px}
.status{text-align:center;margin-bottom:24px;color:#7ee787}
input{width:100%;box-sizing:border-box;background:#111;color:#fff;border:1px solid #555;border-radius:10px;padding:12px;font-size:18px;margin:6px 0 12px}
button{width:100%;border:0;border-radius:10px;padding:13px;background:#f5c400;color:#111;font-weight:700;font-size:16px}
a{color:#f5c400;text-decoration:none}.small{font-size:12px;color:#888;margin-top:20px;line-height:1.5}</style></head><body><div class="card">
<h1>DJI Avata 2 — АКБ №02</h1><div class="sub">Облік акумулятора</div>
<div class="cycles" id="cycles">5</div><div class="status">циклів заряду</div>
<div class="row"><div class="label">Серійний номер</div><div class="value">7QKWM8PAG10264</div></div>
<div class="row"><div class="label">Окуляри</div><div class="value">753XM8M7029LJW</div></div>
<h3>Оновити лічильник</h3>
<input id="newCycles" type="number" min="0" value="5">
<button onclick="save()">Зберегти</button>
<div class="small">Для офіційного значення перевіряй лічильник у DJI Fly. Зміна тут — твій журнал обліку.</div>
<p><a href="index.html">← Усі батареї</a></p></div>
<script>
const KEY="avata2_battery_02";
const saved=localStorage.getItem(KEY);
if(saved!==null){document.getElementById("cycles").textContent=saved;document.getElementById("newCycles").value=saved;}
function save(){const v=document.getElementById("newCycles").value;if(v==="")return;localStorage.setItem(KEY,v);document.getElementById("cycles").textContent=v;}
</script></body></html>
